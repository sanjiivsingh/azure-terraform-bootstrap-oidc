---
framework:
  - terraform
quiet: true
compact: true
skip-check:
  # CKV_AZURE_33: Ensure Storage Account uses Customer Managed Key (CMK)
  # Architectural Decision: Microsoft-managed keys are required for the bootstrap
  # state storage account to eliminate circular dependencies on Azure Key Vault
  # prior to foundational infrastructure deployment.
  - CKV_AZURE_33

  # CKV_AZURE_59: Ensure that Storage accounts disallow public access
  # CKV_AZURE_35: Ensure default network access rule for Storage Accounts is set to deny
  # Architectural Decision: Bootstrap remote state begins in Phase 1 (staged rollout)
  # allowing public network access over TLS 1.2+ with Entra ID OAuth enforcement.
  # Public access is disabled in Phase 2 once Private Endpoints and self-hosted runners are provisioned.
  - CKV_AZURE_59
  - CKV_AZURE_35

  # CKV_AZURE_206: Ensure that Storage Accounts use replication
  # Architectural Decision: Account replication type is parameterized via var.account_replication_type,
  # defaulting to LRS for single-region and dev environments to optimize cost, with ZRS/GRS supported.
  - CKV_AZURE_206
