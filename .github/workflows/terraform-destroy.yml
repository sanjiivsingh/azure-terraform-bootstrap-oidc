name: "Terraform Destroy"

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment to destroy"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - prod
          - bootstrap-guardrail-test
      confirmation:
        description: "Type 'DESTROY-CONFIRM' to authorize destruction"
        required: true
        type: string
      runner_type:
        description: "Runner architecture type (github-hosted or azure-private)"
        required: false
        default: "github-hosted"
        type: choice
        options:
          - github-hosted
          - azure-private

permissions:
  id-token: write
  contents: read

jobs:
  validate-guardrails:
    name: "Validate Destroy Guardrails"
    runs-on: ubuntu-latest
    steps:
      - name: Validate Confirmation String
        run: |
          if [ "${{ github.event.inputs.confirmation }}" != "DESTROY-CONFIRM" ]; then
            echo "❌ Error: Invalid confirmation input. Expected 'DESTROY-CONFIRM'."
            exit 1
          fi
          echo "✅ Destruction authorization confirmed."

  destroy:
    name: "Execute Terraform Destroy"
    needs: validate-guardrails
    runs-on: ${{ github.event.inputs.runner_type == 'azure-private' && fromJSON('["self-hosted", "linux", "azure-private"]') || 'ubuntu-latest' }}
    environment: prod-apply

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.5"

      - name: Authenticate to Azure via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID_APPLY || vars.AZURE_CLIENT_ID_APPLY }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID || vars.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID || vars.AZURE_SUBSCRIPTION_ID }}

      - name: Terraform Initialize
        run: |
          terraform init

      - name: Plan Destruction
        run: |
          echo "### ⚠️ Destruction Plan Review" >> $GITHUB_STEP_SUMMARY
          terraform plan -destroy -no-color > destroy_plan.txt
          echo '```terraform' >> $GITHUB_STEP_SUMMARY
          tail -n 100 destroy_plan.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
        env:
          ARM_USE_OIDC: "true"

      - name: Execute Destruction
        run: |
          echo "Executing terraform destroy..."
          terraform destroy -auto-approve
        env:
          ARM_USE_OIDC: "true"
